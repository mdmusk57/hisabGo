  // ---------- SUPABASE DATA FUNCTIONS ----------
  function mapUser(row){
    return { id: row.id, email: row.email, name: row.name, passwordHash: row.password_hash, joinedAt: row.joined_at };
  }
  function toSupabaseUser(user){
    return { id: user.id, email: user.email, name: user.name, password_hash: user.passwordHash, joined_at: user.joinedAt };
  }
  function mapExpense(row){
    return { id: row.id, amount: Number(row.amount), datetime: row.datetime, category: row.category, payment: row.payment, note: row.note || '', receipt: row.receipt || null };
  }
  function toSupabaseExpense(exp, userId){
    return { id: exp.id, user_id: userId, amount: exp.amount, datetime: exp.datetime, category: exp.category, payment: exp.payment, note: exp.note || '', receipt: exp.receipt };
  }

  async function loadUsers(){
    const { data, error } = await supabase.from('users').select('*');
    if (error) { console.error('Error loading users:', error); return []; }
    return data.map(mapUser);
  }
  async function saveUsers(users){
    const { error } = await supabase.from('users').upsert(users.map(toSupabaseUser));
    if (error) { console.error('Error saving users:', error); showToast(t('storage_save_fail')); return false; }
    return true;
  }
  async function loadExpensesForUser(userId){
    const { data, error } = await supabase.from('expenses').select('*').eq('user_id', userId).order('datetime', { ascending: false });
    if (error) { console.error('Error loading expenses:', error); return []; }
    return data.map(mapExpense);
  }
  async function saveExpensesForUser(userId, list){
    try {
      const { data: existingRows, error: selectError } = await supabase.from('expenses').select('id').eq('user_id', userId);
      if (selectError) throw selectError;
      const existingIds = new Set(existingRows.map(r => r.id));
      const newIds = new Set(list.map(e => e.id));
      const idsToDelete = [...existingIds].filter(id => !newIds.has(id));
      if (idsToDelete.length > 0) {
        const { error: deleteError } = await supabase.from('expenses').delete().in('id', idsToDelete);
        if (deleteError) throw deleteError;
      }
      if (list.length > 0) {
        const rows = list.map(exp => toSupabaseExpense(exp, userId));
        const { error: upsertError } = await supabase.from('expenses').upsert(rows, { onConflict: 'id' });
        if (upsertError) throw upsertError;
      }
      return true;
    } catch (error) {
      console.error('Error saving expenses:', error);
      showToast(t('storage_save_fail'));
      return false;
    }
  }
  async function loadPrefs(userId){
    const { data, error } = await supabase.from('preferences').select('*').eq('user_id', userId).maybeSingle();
    if (error) { console.error('Error loading prefs:', error); return; }
    if (data) {
      state.theme = data.theme || 'paper';
      state.budget = Number(data.budget) || 0;
      state.language = data.language || 'bn';
      applyTheme();
    }
  }
  async function savePrefs(){
    if(!state.session || !state.session.userId) return;
    const prefs = { user_id: state.session.userId, theme: state.theme, budget: state.budget, language: state.language };
    const { error } = await supabase.from('preferences').upsert(prefs, { onConflict: 'user_id' });
    if (error) { console.error('Error saving prefs:', error); showToast(t('storage_save_fail')); }
  }

    el.id = 'hkToast';
    el.className = 'hk-toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(()=>{ if(el.parentNode){ el.classList.add('hk-toast-out'); setTimeout(()=>el.remove(), 250); } }, 3800);
  }

  function applyTheme(){ document.body.classList.toggle('theme-dark', state.theme==='dark'); }

  // ... (বাকি ফাংশনগুলি: init, render, renderAuth, renderApp, renderAdminShell, renderAdminBody, openModal, closeModal, change password, profile, budget, backup, restore, total detail, chart, exportPDF, event handlers ইত্যাদি)
  // নিচে সম্পূর্ণ ফাংশনগুলো আপনার দেওয়া কোড থেকে নেওয়া হয়েছে, কিন্তু window.storage কলগুলো উপরের Supabase ফাংশনে পরিবর্তিত।
  // এই অংশটি খুব বড়, তাই আমি এখানে সংক্ষেপ করছি; আপনি আপনার মূল কোড থেকে বাকি অংশ কপি করুন।

  async function init(){
    await loadDeviceLang();
    await loadRemembered();
    state.session = await loadSession();
    if(state.session && state.session.isAdmin){
      state.users = await loadUsers();
      state.screen = 'admin';
    } else if(state.session && state.session.userId){
      state.users = await loadUsers();
      const stillExists = state.users.find(u=>u.id===state.session.userId);
      if(stillExists){
        state.expenses = await loadExpensesForUser(state.session.userId);
        await loadPrefs(state.session.userId);
        state.screen = 'app';
      } else {
        await clearSession();
        state.screen = 'login';
      }
    } else {
      state.screen = 'login';
    }
    render();
  }

  // ... বাকি সব ফাংশন (render, auth, ইত্যাদি) আপনার মূল কোড থেকে কপি করুন।
  // শুধুমাত্র storage ফাংশনগুলো Supabase দিয়ে প্রতিস্থাপিত হয়েছে।

  // শেষে init() কল
  init();

})();
</script>
