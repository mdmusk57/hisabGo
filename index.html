<style>
@import url('https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap');

:root{
  --ledger-green:#1F4B3F;
  --ledger-green-dark:#163a30;
  --paper:#F7F1E4;
  --paper-line:#E3D9C3;
  --ink:#2B2620;
  --ink-soft:#6b6255;
  --red:#A83232;
  --red-soft:#c95c5c;
  --gold:#C79A3D;
  --card:#FFFDF8;

  --admin-bg:#101720;
  --admin-panel:#182230;
  --admin-panel2:#1f2c3d;
  --admin-text:#E8EDF2;
  --admin-muted:#8CA0B3;
  --admin-accent:#4FD1C5;
  --admin-danger:#E2574C;
  --admin-line:#2a3a4d;
}

*{box-sizing:border-box;}
body{ margin:0; padding:0; }

/* ---- animations & snappy transitions ---- */
@keyframes hkSpin{ to{ transform:rotate(360deg); } }
.hk-spinner{ display:inline-block; width:15px; height:15px; border:2px solid rgba(255,255,255,0.45); border-top-color:#fff; border-radius:50%; animation:hkSpin 0.55s linear infinite; vertical-align:middle; margin-right:7px; }
@keyframes hkFadeIn{ from{ opacity:0; transform:translateY(5px); } to{ opacity:1; transform:translateY(0); } }
.hk-fade-in{ animation:hkFadeIn 0.2s ease; }
button, .hk-chip, .hk-cat-opt, .hk-pay-opt, .hk-stat, .hk-menu-item, .hk-row, .ad-btn, .ad-user-top, .hk-tab, .hk-link{
  transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease, transform 0.08s ease, opacity 0.12s ease, box-shadow 0.12s ease;
}
.hk-add-btn:active, .hk-btn-save:active, .hk-btn-delete:active, .hk-chip:active, .hk-cat-opt:active, .hk-pay-opt:active, .hk-menu-item:active{ transform:scale(0.96); }
.hk-input, .hk-select, .hk-textarea, .hk-search-input{ transition: border-color 0.12s ease, box-shadow 0.12s ease; }
.hk-input:focus, .hk-textarea:focus, .hk-search-input:focus{ outline:none; border-color:var(--ledger-green); box-shadow:0 0 0 3px rgba(31,75,63,0.12); }
.hk-budget-fg{ transition: width 0.4s ease; }

body.theme-dark{
  --paper:#121A20;
  --paper-line:#26333d;
  --ink:#EAF1F5;
  --ink-soft:#93A6B3;
  --card:#1B252D;
  --ledger-green:#2F6A56;
  --ledger-green-dark:#1c4437;
}
body,.hk-root{ font-family:'Hind Siliguri',sans-serif; color:var(--ink); margin:0; padding:0; }
.hk-root{ max-width:640px; margin:0 auto; min-height:100vh; background:var(--paper); position:relative; }
.hk-brand{ font-family:'Poppins',sans-serif; font-weight:700; }

/* ---------- AUTH SCREENS ---------- */
.hk-auth-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    repeating-linear-gradient(var(--paper), var(--paper) 33px, var(--paper-line) 34px);
  padding:30px 18px;
}
.hk-auth-card{
  background:var(--card); border:1px solid var(--paper-line); border-radius:18px;
  padding:28px 26px; width:100%; max-width:380px; box-shadow:0 10px 30px rgba(31,75,63,0.08);
}
.hk-auth-logo{ text-align:center; margin-bottom:4px; }
.hk-auth-logo .hk-brand{ font-size:26px; color:var(--ledger-green); }
.hk-auth-logo .em{ font-size:26px; margin-right:4px; }
.hk-auth-sub{ text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:20px; }
.hk-tabs{ display:flex; background:var(--paper); border-radius:11px; padding:4px; margin-bottom:20px; }
.hk-tab{ flex:1; text-align:center; padding:9px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); }
.hk-tab.active{ background:var(--ledger-green); color:#fff; }
.hk-field{ margin-bottom:14px; }
.hk-label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:600; }
.hk-input,.hk-select,.hk-textarea{
  width:100%; border:1px solid var(--paper-line); border-radius:9px; padding:10px 11px;
  font-family:'Hind Siliguri',sans-serif; font-size:14.5px; background:#fff; color:var(--ink);
}
.hk-textarea{ resize:vertical; min-height:44px; }
.hk-btn-save{
  width:100%; background:var(--ledger-green); color:#fff; border:none; border-radius:10px;
  padding:12px; font-size:15px; font-weight:700; cursor:pointer; font-family:'Hind Siliguri',sans-serif;
}
.hk-error{ color:var(--red); font-size:12.5px; margin-top:-6px; margin-bottom:10px; }
.hk-pw-wrap{ position:relative; }
.hk-pw-wrap .hk-input{ padding-right:40px; }
.hk-eye{ position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:16px; padding:6px; line-height:1; }
.hk-auth-foot{ text-align:center; margin-top:16px; font-size:12px; }
.hk-link{ color:var(--ledger-green); font-weight:700; cursor:pointer; text-decoration:underline; }
.hk-admin-link{ text-align:center; margin-top:14px; font-size:11.5px; color:var(--ink-soft); cursor:pointer; }
.hk-lang-toggle{ font-size:11px; color:var(--ledger-green); font-weight:700; cursor:pointer; text-decoration:underline; }

/* ---------- APP HEADER ---------- */
.hk-spine{ display:none; }
.hk-header{ background:var(--ledger-green); color:var(--paper); padding:18px 24px 20px 24px; border-radius:0 0 18px 18px; position:relative; }
.hk-header-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
.hk-title{ font-size:24px; margin:0 0 2px 0; letter-spacing:0.3px; }
.hk-subtitle{ font-size:12.5px; color:#cfe0d8; margin:0; }
.hk-user-chip{ display:flex; align-items:center; gap:8px; }
.hk-user-name{ font-size:12.5px; color:#e7f0eb; font-weight:600; }
.hk-menu-wrap{ position:relative; }
.hk-menu-btn{ width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.14); border:none; color:#fff; font-size:17px; cursor:pointer; line-height:1; }
.hk-menu-btn:hover{ background:rgba(255,255,255,0.22); }
.hk-menu-panel{ position:absolute; top:calc(100% + 8px); right:0; min-width:215px; max-height:75vh; overflow-y:auto; background:var(--card); border:1px solid var(--paper-line); border-radius:12px; box-shadow:0 10px 26px rgba(0,0,0,0.18); padding:6px; z-index:60; }
.hk-menu-item{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 11px; border-radius:8px; font-size:13px; color:var(--ink); cursor:pointer; }
.hk-menu-item:hover{ background:var(--paper); }
.hk-menu-right{ font-size:11px; color:var(--ink-soft); }
.hk-menu-divider{ height:1px; background:var(--paper-line); margin:5px 4px; }
.hk-menu-danger{ color:var(--red); }
.hk-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.hk-stat{ background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); border-radius:12px; padding:10px 8px; text-align:center; cursor:pointer; }
.hk-stat:hover{ background:rgba(255,255,255,0.16); }
.hk-stat.active{ background:var(--gold); border-color:var(--gold); }
.hk-stat.active .hk-stat-label,.hk-stat.active .hk-stat-amt{ color:var(--ledger-green-dark); }
.hk-stat-label{ font-size:11.5px; color:#d8e6df; margin-bottom:4px; }
.hk-stat-amt{ font-size:17px; font-weight:700; color:#fff; }
.hk-budget-bar-wrap{ margin-top:14px; }
.hk-budget-top{ display:flex; justify-content:space-between; font-size:11.5px; color:#d8e6df; margin-bottom:5px; }
.hk-budget-bg{ height:8px; background:rgba(255,255,255,0.18); border-radius:5px; overflow:hidden; }
.hk-budget-fg{ height:100%; background:var(--gold); border-radius:5px; }
.hk-budget-fg.warn{ background:#e2a33d; }
.hk-budget-fg.over{ background:var(--red-soft); }
.hk-budget-warn{ font-size:11px; color:#ffe1b3; margin-top:5px; }
.hk-search-input{ width:100%; border:1px solid var(--paper-line); border-radius:10px; padding:10px 12px; font-size:13.5px; margin-bottom:12px; background:var(--card); color:var(--ink); font-family:'Hind Siliguri',sans-serif; }

.hk-body{ padding:18px 20px 90px 20px; }
.hk-add-btn{
  width:100%; background:var(--gold); color:var(--ledger-green-dark); border:none; border-radius:12px;
  padding:13px; font-size:15.5px; font-weight:700; cursor:pointer; margin-bottom:18px; box-shadow:0 2px 0 #a97f2a;
}
.hk-add-btn:active{ transform:translateY(2px); box-shadow:none; }
.hk-filters{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:8px; }
.hk-chip{ flex:0 0 auto; background:var(--card); border:1px solid var(--paper-line); border-radius:20px; padding:6px 13px; font-size:13.5px; cursor:pointer; white-space:nowrap; color:var(--ink-soft); }
.hk-chip.active{ background:var(--ledger-green); border-color:var(--ledger-green); color:#fff; }
.hk-section-title{ font-family:'Tiro Bangla',serif; font-size:16px; color:var(--ledger-green); margin:22px 0 10px 0; padding-bottom:6px; border-bottom:1px dashed var(--paper-line); }
.hk-day-label{ font-size:12.5px; color:var(--ink-soft); margin:14px 0 6px 2px; font-weight:600; }
.hk-row{ background:var(--card); border:1px solid var(--paper-line); border-left:3px solid var(--ledger-green); border-radius:10px; padding:11px 12px; display:flex; align-items:center; gap:10px; margin-bottom:8px; cursor:pointer; }
.hk-row-icon{ font-size:20px; flex:0 0 auto; }
.hk-row-main{ flex:1; min-width:0; }
.hk-row-cat{ font-size:14.5px; font-weight:600; }
.hk-row-note{ font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hk-row-right{ text-align:right; flex:0 0 auto; }
.hk-row-amt{ font-size:15px; font-weight:700; color:var(--red); }
.hk-row-pay{ font-size:11px; color:var(--ink-soft); }
.hk-row-thumb{ width:34px;height:34px;border-radius:6px;object-fit:cover;flex:0 0 auto; border:1px solid var(--paper-line);}
.hk-empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:40px 10px; border:1px dashed var(--paper-line); border-radius:12px; background:var(--card); }
.hk-breakdown-row{ margin-bottom:10px; }
.hk-breakdown-top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
.hk-breakdown-bar-bg{ height:8px; background:var(--paper-line); border-radius:5px; overflow:hidden; }
.hk-breakdown-bar-fg{ height:100%; background:var(--ledger-green); border-radius:5px; }
.hk-footer{ text-align:center; font-size:11.5px; color:var(--ink-soft); padding:18px 0 26px 0; }

/* Modal (add/edit expense) */
.hk-overlay{ position:fixed; inset:0; background:rgba(20,20,15,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; animation:hkOverlayFade 0.15s ease; }
@keyframes hkOverlayFade{ from{ background:rgba(20,20,15,0); } to{ background:rgba(20,20,15,0.45); } }
.hk-modal{ background:repeating-linear-gradient(var(--card), var(--card) 33px, var(--paper-line) 34px); width:100%; max-width:640px; border-radius:20px 20px 0 0; padding:20px 20px 24px 20px; max-height:88vh; overflow-y:auto; animation:hkSlideUp 0.16s ease; }
@keyframes hkSlideUp{ from{ transform:translateY(18px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
.hk-modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.hk-modal-title{ font-family:'Tiro Bangla',serif; font-size:19px; color:var(--ledger-green); }
.hk-close{ background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; padding:4px 8px; }
.hk-cat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.hk-cat-opt{ border:1.5px solid var(--paper-line); border-radius:11px; padding:9px 4px; text-align:center; font-size:11.5px; cursor:pointer; background:#fff; color:var(--ink-soft); }
.hk-cat-opt .em{ font-size:19px; display:block; margin-bottom:3px; }
.hk-cat-opt.active{ border-color:var(--ledger-green); background:#eaf2ee; color:var(--ledger-green); font-weight:700; }
.hk-pay-row{ display:flex; gap:8px; flex-wrap:wrap; }
.hk-pay-opt{ border:1.5px solid var(--paper-line); border-radius:20px; padding:7px 13px; font-size:13px; cursor:pointer; background:#fff; color:var(--ink-soft); }
.hk-pay-opt.active{ border-color:var(--gold); background:#fbf1dc; color:#8a6a1f; font-weight:700; }
.hk-upload-box{ border:1.5px dashed var(--paper-line); border-radius:11px; padding:14px; text-align:center; font-size:13px; color:var(--ink-soft); cursor:pointer; position:relative; }
.hk-upload-preview{ max-width:100%; max-height:130px; border-radius:8px; margin-top:8px; }
.hk-upload-box input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
.hk-modal-actions{ display:flex; gap:10px; margin-top:6px; }
.hk-btn-delete{ background:#fff; color:var(--red); border:1.5px solid var(--red-soft); border-radius:10px; padding:12px 16px; font-size:14px; font-weight:600; cursor:pointer; font-family:'Hind Siliguri',sans-serif; }
.hk-loading{ text-align:center; padding:60px 10px; color:var(--ink-soft); font-size:14px; }
.hk-pdf-loading{ position:fixed; inset:0; background:rgba(15,15,10,0.55); display:flex; align-items:center; justify-content:center; z-index:100; color:#fff; font-size:14px; text-align:center; padding:20px; }
.hk-toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#2B2620; color:#fff; padding:12px 18px; border-radius:10px; font-size:13px; max-width:88%; text-align:center; z-index:200; box-shadow:0 8px 22px rgba(0,0,0,0.25); animation:hkToastIn 0.2s ease; }
.hk-toast-out{ animation:hkToastOut 0.25s ease forwards; }
@keyframes hkToastIn{ from{ opacity:0; transform:translateX(-50%) translateY(10px); } to{ opacity:1; transform:translateX(-50%) translateY(0); } }
@keyframes hkToastOut{ to{ opacity:0; transform:translateX(-50%) translateY(10px); } }
.hk-legend-row{ display:flex; align-items:center; gap:7px; font-size:12.5px; margin-bottom:7px; }
.hk-legend-dot{ width:10px; height:10px; border-radius:3px; flex:0 0 auto; }
.hk-legend-label{ flex:1; }
.hk-legend-pct{ font-weight:700; }

/* ---------- ADMIN PANEL (visually separate) ---------- */
.ad-root{ min-height:100vh; background:var(--admin-bg); color:var(--admin-text); font-family:'Hind Siliguri',sans-serif; }
.ad-wrap{ max-width:920px; margin:0 auto; padding:0 0 60px 0; }
.ad-header{ display:flex; justify-content:space-between; align-items:center; padding:20px 22px; border-bottom:1px solid var(--admin-line); }
.ad-brand{ font-size:19px; color:var(--admin-accent); }
.ad-brand .tag{ font-size:11px; color:var(--admin-muted); display:block; margin-top:2px; font-weight:400; }
.ad-logout{ font-size:12.5px; color:var(--admin-muted); border:1px solid var(--admin-line); padding:7px 13px; border-radius:8px; cursor:pointer; }
.ad-logout:hover{ color:var(--admin-text); border-color:var(--admin-accent); }
.ad-body{ padding:20px 22px; }
.ad-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
.ad-stat{ background:var(--admin-panel); border:1px solid var(--admin-line); border-radius:12px; padding:14px; }
.ad-stat-label{ font-size:11.5px; color:var(--admin-muted); margin-bottom:6px; }
.ad-stat-val{ font-size:20px; font-weight:700; color:var(--admin-text); }
.ad-search{ width:100%; background:var(--admin-panel); border:1px solid var(--admin-line); border-radius:10px; padding:11px 14px; color:var(--admin-text); font-size:13.5px; margin-bottom:16px; font-family:'Hind Siliguri',sans-serif; }
.ad-search::placeholder{ color:var(--admin-muted); }
.ad-section-title{ font-size:14px; color:var(--admin-muted); margin:0 0 12px 0; text-transform:none; }
.ad-user-card{ background:var(--admin-panel); border:1px solid var(--admin-line); border-radius:12px; margin-bottom:10px; overflow:hidden; }
.ad-user-top{ display:flex; align-items:center; gap:12px; padding:14px; cursor:pointer; }
.ad-avatar{ width:38px; height:38px; border-radius:50%; background:var(--admin-accent); color:#0b1116; display:flex; align-items:center; justify-content:center; font-weight:700; flex:0 0 auto; }
.ad-user-info{ flex:1; min-width:0; }
.ad-user-name{ font-size:14.5px; font-weight:600; }
.ad-user-email{ font-size:12px; color:var(--admin-muted); }
.ad-user-meta{ text-align:right; font-size:12px; color:var(--admin-muted); flex:0 0 auto; }
.ad-user-meta .amt{ color:var(--admin-accent); font-weight:700; font-size:14px; display:block; }
.ad-user-actions{ display:flex; gap:8px; padding:0 14px 14px 14px; }
.ad-btn{ font-size:12px; border-radius:8px; padding:7px 12px; cursor:pointer; border:1px solid var(--admin-line); background:transparent; color:var(--admin-muted); font-family:'Hind Siliguri',sans-serif; }
.ad-btn:hover{ color:var(--admin-text); }
.ad-btn-danger{ color:var(--admin-danger); border-color:rgba(226,87,76,0.4); }
.ad-btn-danger:hover{ background:rgba(226,87,76,0.1); }
.ad-detail{ border-top:1px solid var(--admin-line); padding:14px; background:var(--admin-panel2); }
.ad-empty{ text-align:center; color:var(--admin-muted); padding:40px; border:1px dashed var(--admin-line); border-radius:12px; }
.ad-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--admin-line); font-size:13px; }
.ad-row:last-child{ border-bottom:none; }
.ad-row .cat{ color:var(--admin-text); }
.ad-row .amt{ color:var(--admin-accent); font-weight:600; }
.ad-foot{ text-align:center; font-size:11px; color:var(--admin-muted); padding:20px 0; }

/* ---------- LARGER SCREENS: the notebook sits on a "desk" ---------- */
@media (min-width:840px){
  body{
    background: radial-gradient(ellipse at top, #efe8d6 0%, #ddd0ab 55%, #cfc094 100%);
  }
  body.theme-dark{
    background: radial-gradient(ellipse at top, #1b2530 0%, #0d1318 65%, #070a0d 100%);
  }
  .hk-root{
    max-width:600px; margin:36px auto 60px auto; min-height:calc(100vh - 96px);
    border-radius:22px; overflow:hidden;
    box-shadow:0 34px 64px -24px rgba(40,30,10,0.38), 0 1px 0 rgba(255,255,255,0.5) inset;
  }
  body.theme-dark .hk-root{ box-shadow:0 34px 64px -24px rgba(0,0,0,0.6); }
  .hk-auth-wrap{ background:transparent; }

  /* Modal reads as a centered dialog on desktop, not a phone bottom-sheet */
  .hk-overlay{ align-items:center; padding:24px; }
  .hk-modal{ border-radius:20px; max-width:460px; animation:hkModalPop 0.16s ease; }
  @keyframes hkModalPop{ from{ transform:scale(0.96); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .ad-root{ background: radial-gradient(ellipse at top, #22303f 0%, var(--admin-bg) 60%); }
  .ad-wrap{ padding-top:8px; }
}

/* ---------- MOUSE / TRACKPAD: hover feedback ---------- */
@media (hover:hover) and (pointer:fine){
  .hk-add-btn:hover{ filter:brightness(1.04); }
  .hk-chip:hover{ border-color:var(--ledger-green); color:var(--ledger-green); }
  .hk-chip.active:hover{ color:#fff; }
  .hk-row:hover{ border-color:var(--ledger-green); transform:translateY(-1px); box-shadow:0 6px 14px rgba(31,75,63,0.1); }
  .hk-menu-item:hover{ background:var(--paper); }
  .hk-menu-btn:hover{ background:rgba(255,255,255,0.22); }
  .hk-cat-opt:hover{ border-color:var(--ledger-green); }
  .hk-pay-opt:hover{ border-color:var(--gold); }
  .hk-tab:not(.active):hover{ color:var(--ledger-green); }
  .hk-link:hover{ opacity:0.78; }
  .hk-btn-save:hover{ filter:brightness(1.06); }
  .hk-btn-delete:hover{ background:#fdf2f2; }
  .ad-user-top:hover{ background:rgba(255,255,255,0.03); }
}
</style>

<div id="hkApp"></div>

<script>
(function(){
  const CATEGORIES = [
    {id:'food', em:'🍚', bn:'খাবার', en:'Food'},
    {id:'transport', em:'🚌', bn:'যাতায়াত', en:'Transport'},
    {id:'market', em:'🛒', bn:'বাজার', en:'Groceries'},
    {id:'home', em:'🏠', bn:'বাসা', en:'Rent/Home'},
    {id:'net', em:'📱', bn:'মোবাইল/ইন্টারনেট', en:'Mobile/Internet'},
    {id:'edu', em:'🎓', bn:'পড়াশোনা', en:'Education'},
    {id:'medical', em:'💊', bn:'চিকিৎসা', en:'Medical'},
    {id:'fun', em:'🎮', bn:'বিনোদন', en:'Entertainment'},
    {id:'fuel', em:'🏍️', bn:'বাইক ফুয়েল', en:'Bike Fuel'},
    {id:'shopping', em:'🛍', bn:'Shopping', en:'Shopping'},
    {id:'other', em:'📦', bn:'অন্যান্য', en:'Others'},
  ];

  // Before any write, ask Supabase directly "is this session actually still
  // valid" instead of trusting the possibly-stale id kept in memory. If the
  // session has gone stale, this also gives it a chance to auto-refresh.
  async function verifiedUserId(){
    try{
      const { data, error } = await supabase.auth.getUser();
      if(error){
        console.error('getUser error:', error);
        showToast('Auth check failed: ' + (error.message || error.name || 'unknown'));
        return null;
      }
      if(!data || !data.user){
        showToast(t('session_expired'));
        return null;
      }
      return data.user.id;
    }catch(e){
      console.error('getUser threw:', e);
      showToast('Auth check error: ' + (e && e.message ? e.message : String(e)));
      return null;
    }

    const { data, error } = await supabase.from('expenses').insert({
      user_id: uid,
      amount: record.amount,
      datetime: new Date(record.datetime).toISOString(),
      category: record.category,
      payment: record.payment,
      note: record.note,
      receipt: record.receipt,
    }).select().single();
    if(error){ console.error(error); showToast(error.message || t('storage_save_fail')); return null; }
    return { id:data.id, amount:Number(data.amount), datetime:data.datetime, category:data.category, payment:data.payment, note:data.note||'', receipt:data.receipt||null };
  }
  async function updateExpenseDb(id, record){
    const { error } = await supabase.from('expenses').update({
      amount: record.amount,
      datetime: new Date(record.datetime).toISOString(),
      category: record.category,
      payment: record.payment,
      note: record.note,
      receipt: record.receipt,
    }).eq('id', id);
    if(error){ console.error(error); showToast(error.message || t('storage_save_fail')); return false; }
    return true;
  }
  async function deleteExpenseDb(id){
    const { error } = await supabase.from('expenses').delete().eq('id', id);
    if(error){ console.error(error); showToast(error.message || t('storage_save_fail')); return false; }
    return true;

  function loadScript(src){
    return new Promise((resolve,reject)=>{
      if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = ()=>reject(new Error('script load failed: '+src));
      document.head.appendChild(s);
    });
  }

  function setBtnLoading(btn, loading){
    if(!btn) return;
    if(loading){
      if(!btn.dataset.origLabel) btn.dataset.origLabel = btn.innerHTML;
      btn.innerHTML = `<span class="hk-spinner"></span>${btn.dataset.origLabel}`;

      btn.style.opacity = '0.85';

  async function init(){
    await loadDeviceLang();

    try{
      await ensureSupabase();
      const { data:{ session } } = await supabase.auth.getSession();
      if(session && session.user){

        if(state.session.isAdmin){
          await loadAdminData();
          state.screen = 'admin';
        } else {
          state.expenses = await loadExpensesForUser(state.session.userId);
          await loadPrefsFromDb(state.session.userId);

    render();

  function withinRange(d, range){
    const now = new Date();
    if(range==='today') return dayKey(d)===dayKey(now);
    if(range==='week'){ const start=new Date(now); start.setDate(now.getDate()-6); start.setHours(0,0,0,0); return d>=start && d<=now; }
    if(range==='month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    return true;
  }
  function sumFor(list, range){
    return list.filter(e=>withinRange(new Date(e.datetime), range)).reduce((s,e)=>s+Number(e.amount||0),0);
  }

  function render(){
    const root = document.getElementById('hkApp');
    if(state.screen==='login' || state.screen==='signup') root.innerHTML = renderAuth();
    else if(state.screen==='app') root.innerHTML = renderApp();
    else if(state.screen==='admin') root.innerHTML = renderAdminShell();
    else root.innerHTML = `<div class="hk-loading">লোড হচ্ছে...</div>`;
    attachHandlers();
    if(state.screen==='admin') renderAdminBody();
  }

  // ---------------- USER APP (ledger) ----------------
  function renderApp(){
    const list = state.expenses;
    const todaySum = sumFor(list,'today'), weekSum = sumFor(list,'week'), monthSum = sumFor(list,'month');
    const allTimeTotal = list.reduce((s,e)=>s+Number(e.amount||0),0);
    const budgetPct = state.budget>0 ? Math.min(999, Math.round((monthSum/state.budget)*100)) : 0;
    const budgetClass = budgetPct>=100 ? 'over' : (budgetPct>=80 ? 'warn' : '');
    const sq = (state.searchQuery||'').trim().toLowerCase();
    const filtered = list
      .filter(e=>state.filterCat==='all' || e.category===state.filterCat)
      .filter(e=>withinRange(new Date(e.datetime), state.filterRange))
      .filter(e=> !sq || (e.note||'').toLowerCase().includes(sq) || catInfo(e.category).name.toLowerCase().includes(sq) || (e.payment||'').toLowerCase().includes(sq))
      .sort((a,b)=> new Date(b.datetime)-new Date(a.datetime));

    const groups = []; let lastKey=null;
    filtered.forEach(e=>{
      const d = new Date(e.datetime); const k = dayKey(d);
      if(k!==lastKey){ groups.push({key:k,date:d,items:[]}); lastKey=k; }
      groups[groups.length-1].items.push(e);
    });

    const monthExpenses = list.filter(e=>withinRange(new Date(e.datetime),'month'));
    const byCat = {};
    monthExpenses.forEach(e=>{ byCat[e.category] = (byCat[e.category]||0) + Number(e.amount||0); });
    const maxCat = Math.max(1, ...Object.values(byCat));
    const breakdownRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>{
      const info = catInfo(cat); const pct = Math.round((amt/maxCat)*100);

        <div class="hk-breakdown-top"><span>${info.em} ${info.name}</span><span>৳${fmtAmt(amt)}</span></div>
        <div class="hk-breakdown-bar-bg"><div class="hk-breakdown-bar-fg" style="width:${pct}%"></div></div>

    return `

      <div class="hk-spine"></div>
      <div class="hk-header">
        <div class="hk-header-top">
          <div><div class="hk-title hk-brand">HisabGo</div><div class="hk-subtitle">${t('app_subtitle')}</div></div>

                <div class="hk-menu-item" id="menuProfile">${t('menu_profile')}</div>
                <div class="hk-menu-item" id="menuChangePw">${t('menu_change_pw')}</div>
                <div class="hk-menu-item" id="menuBudget">${t('menu_budget')} ${state.budget>0?`<span class="hk-menu-right">৳${fmtAmt(state.budget)}</span>`:''}</div>
                <div class="hk-menu-item" id="menuChart">${t('menu_chart')}</div>
                <div class="hk-menu-item" id="menuExportPdf">${t('menu_export_pdf')}</div>
                <div class="hk-menu-item" id="menuBackup">${t('menu_backup')}</div>
                <div class="hk-menu-item" id="menuRestore">${t('menu_restore')}</div>
                <div class="hk-menu-divider"></div>
                <div class="hk-menu-item hk-menu-danger" id="menuLogout">${t('menu_logout')}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="hk-stats">
          <div class="hk-stat ${state.filterRange==='today'?'active':''}" data-range="today"><div class="hk-stat-label">${t('stat_today')}</div><div class="hk-stat-amt">৳${fmtAmt(todaySum)}</div></div>
          <div class="hk-stat ${state.filterRange==='week'?'active':''}" data-range="week"><div class="hk-stat-label">${t('stat_week')}</div><div class="hk-stat-amt">৳${fmtAmt(weekSum)}</div></div>
          <div class="hk-stat ${state.filterRange==='month'?'active':''}" data-range="month"><div class="hk-stat-label">${t('stat_month')}</div><div class="hk-stat-amt">৳${fmtAmt(monthSum)}</div></div>
        </div>
        ${state.budget>0 ? `
        <div class="hk-budget-bar-wrap">
          <div class="hk-budget-top"><span>${t('budget_label_dash')}</span><span>৳${fmtAmt(monthSum)} / ৳${fmtAmt(state.budget)}</span></div>
          <div class="hk-budget-bg"><div class="hk-budget-fg ${budgetClass}" style="width:${Math.min(100,budgetPct)}%"></div></div>
          ${budgetPct>=100 ? `<div class="hk-budget-warn">${t('budget_over')} ৳${fmtAmt(monthSum-state.budget)} ${t('budget_over_suffix')}</div>` : budgetPct>=80 ? `<div class="hk-budget-warn">${t('budget_warn')} ${toBn(budgetPct)}${t('budget_warn_suffix')}</div>` : ''}

        ${breakdownRows ? `<div class="hk-section-title">${t('section_month_breakdown')}</div>${breakdownRows}` : ''}
        <div class="hk-footer">${t('footer_credit')}</div>
      </div>
    </div>`;
  }

  async function loadAdminData(){
    const { data: profiles, error: pErr } = await supabase.rpc('admin_get_profiles');
    if(pErr) console.error(pErr);
    state.users = profiles || [];
    const { data: allExpenses, error: eErr } = await supabase.rpc('admin_get_expenses');
    if(eErr) console.error(eErr);
    state.adminCache = {};
    (allExpenses || []).forEach(e=>{
      if(!state.adminCache[e.user_id]) state.adminCache[e.user_id] = { list:[], count:0, total:0 };
      state.adminCache[e.user_id].list.push({ id:e.id, amount:Number(e.amount), datetime:e.datetime, category:e.category, payment:e.payment, note:e.note||'', receipt:e.receipt||null });
      state.adminCache[e.user_id].count++;
      state.adminCache[e.user_id].total += Number(e.amount || 0);
    });
  }

  function downloadBackup(){

      expenses: state.expenses,

    a.href = url; a.download = 'hisabgo-backup-'+dayKey(new Date())+'.json';

  function triggerRestore(){
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'application/json';
    input.onchange = async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      try{
        const text = await file.text();
        const data = JSON.parse(text);
        const incoming = Array.isArray(data.expenses) ? data.expenses : (Array.isArray(data) ? data : null);
        if(!incoming) throw new Error('invalid backup file');
        let added = 0;
        for(const exp of incoming){
          if(exp && exp.amount){
            const inserted = await insertExpense({ amount:exp.amount, datetime: exp.datetime || new Date().toISOString(), category: exp.category || 'other', payment: exp.payment || 'ক্যাশ', note: exp.note || '', receipt: exp.receipt || null });
            if(inserted){ state.expenses.push(inserted); added++; }
          }
        }
        render();
        alert(`${toBn(added)}${t('backup_confirm')}`);
      }catch(err){
        alert(t('backup_invalid'));
      }
    };
    input.click();
  }

  // ---------------- CHART MODAL ----------------
  const CHART_PALETTE = ['#1F4B3F','#A83232','#C79A3D','#4a7c94','#8e5b9e','#c2703d','#4f8a5b','#a24d72','#527a3e','#7a5230','#5c6270'];

  function buildDonutSVG(data){
    const total = data.reduce((s,d)=>s+d.value,0) || 1;
    const radius=58, cx=70, cy=70, sw=24;
    const circumference = 2*Math.PI*radius;
    let cumulative = 0, circles = '';
    data.forEach(d=>{
      const frac = d.value/total;
      const dash = frac*circumference;
      const gap = circumference-dash;
      const rotation = (cumulative/total)*360 - 90;
      circles += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${d.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${gap}" transform="rotate(${rotation} ${cx} ${cy})"/>`;
      cumulative += d.value;
    });
    return `<svg viewBox="0 0 140 140" width="140" height="140">${circles}</svg>`;
  }

  function buildBarChartSVG(labels, values){
    const max = Math.max(1, ...values);
    const barW=28, gap=13, height=100;
    const width = labels.length*(barW+gap)+gap;
    let bars = '';
    values.forEach((v,i)=>{
      const h = Math.max(2, Math.round((v/max)*height));
      const x = gap + i*(barW+gap);
      const y = height - h;
      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="var(--ledger-green)"/>`;
      bars += `<text x="${x+barW/2}" y="${height+16}" font-size="10" text-anchor="middle" fill="var(--ink-soft)">${labels[i]}</text>`;
    });
    return `<svg viewBox="0 0 ${width} ${height+22}" width="100%" height="130" style="max-width:${width}px;">${bars}</svg>`;
  }

  // ---------------- PDF EXPORT ----------------
  async function exportPDF(){
    const loadingEl = document.createElement('div');
    loadingEl.className = 'hk-pdf-loading';
    loadingEl.innerHTML = `<div style="text-align:center;"><div class="hk-spinner" style="width:26px;height:26px;border-width:3px;margin:0 auto 10px auto;"></div>${t('pdf_generating')}</div>`;
    document.body.appendChild(loadingEl);
    try{
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');

      const sorted = state.expenses.slice().sort((a,b)=> new Date(b.datetime)-new Date(a.datetime));
      const total = sorted.reduce((s,e)=>s+Number(e.amount||0),0);

      const container = document.createElement('div');
      container.style.cssText = 'position:fixed; left:-9999px; top:0; width:700px; background:#fff; padding:28px; font-family:\'Hind Siliguri\',sans-serif; color:#2B2620;';
      container.innerHTML = `
        <div style="font-size:22px; font-weight:700; color:#1F4B3F; margin-bottom:2px;">${t('pdf_title')}</div>
        <div style="font-size:12.5px; color:#6b6255; margin-bottom:18px;">${escapeHtml(state.session.name)} · ${t('pdf_generated')} ${new Date().toLocaleDateString(state.language==='en'?'en-US':'bn-BD')}</div>
        <div style="font-size:14px; font-weight:700; margin-bottom:14px;">${t('pdf_total_line')} ৳${fmtAmt(total)} (${toBn(sorted.length)}${t('entries_suffix')})</div>
        <table style="width:100%; border-collapse:collapse; font-size:12px;">
          <thead><tr style="background:#1F4B3F; color:#fff;">
            <th style="padding:8px; text-align:left;">${t('pdf_col_date')}</th>
            <th style="padding:8px; text-align:left;">${t('pdf_col_cat')}</th>
            <th style="padding:8px; text-align:left;">${t('pdf_col_pay')}</th>
            <th style="padding:8px; text-align:left;">${t('pdf_col_note')}</th>
            <th style="padding:8px; text-align:right;">${t('pdf_col_amt')}</th>
          </tr></thead>
          <tbody>
            ${sorted.length===0 ? `<tr><td colspan="5" style="padding:14px; text-align:center; color:#6b6255;">${t('pdf_no_data')}</td></tr>` :
              sorted.map((e,i)=>{
                const d = new Date(e.datetime);
                const info = catInfo(e.category);
                return `<tr style="background:${i%2===0?'#F7F1E4':'#ffffff'};">
                  <td style="padding:7px 8px; border-bottom:1px solid #E3D9C3;">${toBn(d.getDate())} ${monthFull(d.getMonth())} ${toBn(d.getFullYear())}</td>
                  <td style="padding:7px 8px; border-bottom:1px solid #E3D9C3;">${info.em} ${info.name}</td>
                  <td style="padding:7px 8px; border-bottom:1px solid #E3D9C3;">${paymentDisplay(e.payment)}</td>
                  <td style="padding:7px 8px; border-bottom:1px solid #E3D9C3;">${escapeHtml(e.note||'-')}</td>
                  <td style="padding:7px 8px; border-bottom:1px solid #E3D9C3; text-align:right; color:#A83232; font-weight:700;">৳${fmtAmt(e.amount)}</td>
                </tr>`;
              }).join('')}
          </tbody>
        </table>
      `;
      document.body.appendChild(container);

      const canvas = await html2canvas(container, { scale:2, backgroundColor:'#ffffff' });
      document.body.removeChild(container);

      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p','pt','a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgWidth = pageWidth;
      const imgHeight = canvas.height * imgWidth / canvas.width;
      let heightLeft = imgHeight;
      let position = 0;
      pdf.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
      heightLeft -= pageHeight;
      while(heightLeft > 0){
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
        heightLeft -= pageHeight;
      }
      pdf.save('HisabGo-report.pdf');
    }catch(err){
      console.error(err);
      alert(t('pdf_fail'));
    }finally{
      if(loadingEl.parentNode) document.body.removeChild(loadingEl);
    }
  }

        </div>
        <div class="hk-field"><label class="hk-label">${t('label_payment')}</label>
          <div class="hk-pay-row" id="hkPayRow">${PAYMENTS.map(p=>`<div class="hk-pay-opt ${state.editing.payment===p?'active':''}" data-pay="${p}">${paymentDisplay(p)}</div>`).join('')}</div>
        </div>
        <div class="hk-field"><label class="hk-label">${t('label_note')}</label><textarea class="hk-textarea" id="hkNote" placeholder="${t('note_placeholder')}">${escapeHtml(state.editing.note)}</textarea></div>
        <div class="hk-field"><label class="hk-label">${t('label_receipt')}</label>
          <div class="hk-upload-box" id="hkUploadBox">
            <span id="hkUploadText">${state.editing.receipt ? t('upload_change') : t('upload_new')}</span>
            <img class="hk-upload-preview" id="hkPreviewImg" src="${state.editing.receipt||''}" style="${state.editing.receipt?'':'display:none;'}"/>
            <input type="file" accept="image/*" id="hkFileInput"/>
          </div>
        </div>
        <div class="hk-modal-actions">
          ${isEdit ? `<button class="hk-btn-delete" id="hkDeleteBtn">${t('btn_delete')}</button>` : ''}
          <button class="hk-btn-save" id="hkSaveBtn">${isEdit ? t('btn_update') : t('btn_save')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    overlay.querySelector('#hkModalClose').onclick = closeModal;
    overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
    overlay.querySelectorAll('#hkCatGrid .hk-cat-opt').forEach(el=>{
      el.onclick = ()=>{ overlay.querySelectorAll('#hkCatGrid .hk-cat-opt').forEach(o=>o.classList.remove('active')); el.classList.add('active'); state.editing.category = el.getAttribute('data-cat'); };
    });
    overlay.querySelectorAll('#hkPayRow .hk-pay-opt').forEach(el=>{
      el.onclick = ()=>{ overlay.querySelectorAll('#hkPayRow .hk-pay-opt').forEach(o=>o.classList.remove('active')); el.classList.add('active'); state.editing.payment = el.getAttribute('data-pay'); };
    });
    overlay.querySelector('#hkFileInput').onchange = (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const canvas = document.createElement('canvas'); const maxDim = 480;
          let w=img.width,h=img.height;
          if(w>h && w>maxDim){ h=h*(maxDim/w); w=maxDim; } else if(h>maxDim){ w=w*(maxDim/h); h=maxDim; }
          canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          const dataUrl = canvas.toDataURL('image/jpeg',0.5);
          state.editing.receipt = dataUrl;
          const preview = overlay.querySelector('#hkPreviewImg');
          preview.src = dataUrl; preview.style.display='block';
          overlay.querySelector('#hkUploadText').textContent = 'ছবি পরিবর্তন করতে চাপ দিন';
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
    overlay.querySelector('#hkSaveBtn').onclick = async ()=>{
      const amountVal = parseFloat(overlay.querySelector('#hkAmount').value);
      if(!amountVal || amountVal<=0){ overlay.querySelector('#hkAmountErr').style.display='block'; return; }
      const dtVal = overlay.querySelector('#hkDatetime').value || toLocalInputValue(new Date());
      const noteVal = overlay.querySelector('#hkNote').value.trim();
      const saveBtn = overlay.querySelector('#hkSaveBtn');
      const record = { id: state.editing.id, amount:amountVal, datetime:dtVal, category:state.editing.category, payment:state.editing.payment, note:noteVal, receipt:state.editing.receipt };
      setBtnLoading(saveBtn, true);
      if(isEdit){
        const ok = await updateExpenseDb(record.id, record);
        setBtnLoading(saveBtn, false);
        if(!ok) return;
        const idx = state.expenses.findIndex(x=>x.id===record.id);
        if(idx>-1) state.expenses[idx] = record;
      } else {
        const inserted = await insertExpense(record);
        setBtnLoading(saveBtn, false);
        if(!inserted) return;
        state.expenses.push(inserted);
      }
      closeModal(); render();
    };
    if(isEdit){
      overlay.querySelector('#hkDeleteBtn').onclick = async ()=>{
        if(!confirm(t('confirm_delete_expense'))) return;
        const ok = await deleteExpenseDb(exp.id);
        if(!ok) return;
        state.expenses = state.expenses.filter(x=>x.id!==exp.id);
        closeModal(); render();
      };
    }
  }
  function closeModal(){ const o=document.getElementById('hkOverlay'); if(o) o.remove(); state.editing=null; }

  // ---------------- EVENT WIRING ----------------
  function attachHandlers(){
    // auth tabs
    const tabLogin = document.getElementById('tabLogin');
    const tabSignup = document.getElementById('tabSignup');
    if(tabLogin) tabLogin.onclick = ()=>{ state.screen='login'; state.authError=''; render(); };
    if(tabSignup) tabSignup.onclick = ()=>{ state.screen='signup'; state.authError=''; render(); };
    const goLogin = document.getElementById('goLogin'); if(goLogin) goLogin.onclick = ()=>{ state.screen='login'; state.authError=''; render(); };
    const goSignup = document.getElementById('goSignup'); if(goSignup) goSignup.onclick = ()=>{ state.screen='signup'; state.authError=''; render(); };
    const goAdmin = document.getElementById('goAdmin'); if(goAdmin) goAdmin.onclick = ()=>{ state.screen='adminlogin'; state.authError=''; render(); };
    const authLangToggle = document.getElementById('authLangToggle');
    if(authLangToggle) authLangToggle.onclick = async ()=>{ state.language = state.language==='bn' ? 'en' : 'bn'; await saveDeviceLang(); render(); };

    // login
    const loginBtn = document.getElementById('loginBtn');
    if(loginBtn) loginBtn.onclick = async ()=>{
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const pass = document.getElementById('loginPass').value;
      const rememberChk = document.getElementById('rememberMeChk');
      if(!email || !pass){ state.authError = t('err_fill_email_pw'); render(); return; }
      setBtnLoading(loginBtn, true);
      const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
      if(error || !data.user){ setBtnLoading(loginBtn, false); state.authError = t('err_login_fail'); render(); return; }
      if(rememberChk && rememberChk.checked){ await saveRemembered(email, pass); } else { await clearRemembered(); }
      await hydrateSessionFromAuthUser(data.user);
      if(state.session.isAdmin){
        await loadAdminData();
        state.authError=''; state.screen='admin'; render();
        return;
      }
      state.expenses = await loadExpensesForUser(state.session.userId);
      await loadPrefsFromDb(state.session.userId);
      state.authError=''; state.screen='app'; render();
    };

    // signup
    const signupBtn = document.getElementById('signupBtn');
    if(signupBtn) signupBtn.onclick = async ()=>{
      const name = document.getElementById('suName').value.trim();
      const email = document.getElementById('suEmail').value.trim().toLowerCase();
      const pass = document.getElementById('suPass').value;
      const pass2 = document.getElementById('suPass2').value;
      if(!name || !email || !pass){ state.authError=t('err_fill_all'); render(); return; }
      if(!validEmail(email)){ state.authError=t('err_valid_email'); render(); return; }
      if(pass.length<4){ state.authError=t('err_pw_len'); render(); return; }
      if(pass!==pass2){ state.authError=t('err_pw_match'); render(); return; }
      setBtnLoading(signupBtn, true);
      const { data, error } = await supabase.auth.signUp({ email, password: pass, options:{ data:{ name } } });
      setBtnLoading(signupBtn, false);
      if(error){ state.authError = error.message.includes('already') ? t('err_email_exists') : error.message; render(); return; }
      if(!data.session){
        // Email confirmation is required by the Supabase project settings
        state.authError = t('check_email_confirm'); state.screen='login'; render(); return;
      }
      await saveRemembered(email, pass);
      await hydrateSessionFromAuthUser(data.user);
      state.expenses = [];
      state.theme = 'paper'; applyTheme();
      state.authError=''; state.screen='app'; render();
    };

    // app
    const addBtn = document.getElementById('hkAddBtn'); if(addBtn) addBtn.onclick = ()=> openModal({});
    const menuBtn = document.getElementById('hkMenuBtn');
    const menuPanel = document.getElementById('hkMenuPanel');
    if(menuBtn && menuPanel){
      menuBtn.onclick = (e)=>{ e.stopPropagation(); menuPanel.style.display = menuPanel.style.display==='none' ? 'block' : 'none'; };
      document.addEventListener('click', (e)=>{
        if(menuPanel.style.display!=='none' && !menuPanel.contains(e.target) && e.target!==menuBtn){ menuPanel.style.display='none'; }
      });
    }
    const menuTotalExpense = document.getElementById('menuTotalExpense');
    if(menuTotalExpense) menuTotalExpense.onclick = ()=>{ if(menuPanel) menuPanel.style.display='none'; openTotalDetailModal(); };
    const menuThemeToggle = document.getElementById('menuThemeToggle');
    if(menuThemeToggle) menuThemeToggle.onclick = async ()=>{
      state.theme = state.theme==='paper' ? 'dark' : 'paper';
      applyTheme();
      await savePrefsToDb();
      const label = document.getElementById('themeState');
      if(label) label.textContent = state.theme==='dark' ? 'Dark' : 'Light';
    };
    const menuLangToggle = document.getElementById('menuLangToggle');
    if(menuLangToggle) menuLangToggle.onclick = async ()=>{
      if(menuPanel) menuPanel.style.display='none';
      state.language = state.language==='bn' ? 'en' : 'bn';
      await savePrefsToDb();
      await saveDeviceLang();
      render();
    };
    const menuChangePw = document.getElementById('menuChangePw');
    if(menuChangePw) menuChangePw.onclick = ()=>{ if(menuPanel) menuPanel.style.display='none'; openChangePasswordModal(); };
    const menuProfile = document.getElementById('menuProfile');
    if(menuProfile) menuProfile.onclick = ()=>{ if(menuPanel) menuPanel.style.display='none'; openProfileModal(); };
    const menuBudget = document.getElementById('menuBudget');
    if(menuBudget) menuBudget.onclick = ()=>{ if(menuPanel) menuPanel.style.display='none'; openBudgetModal(); };
    const menuChart = document.getElementById('menuChart');
    if(menuChart) menuChart.onclick = ()=>{ if(menuPanel) menuPanel.style.display='none'; openChartModal(); };
    const menuExportPdf = document.getElementById('menuExportPdf');
    if(menuExportPdf) menuExportPdf.onclick = ()=>{ if(menuPanel) menuPanel.style.display='none'; exportPDF(); };
    const menuBackup = document.getElementById('menuBackup');
    if(menuBackup) menuBackup.onclick = ()=>{ if(menuPanel) menuPanel.style.display='none'; downloadBackup(); };
    const menuRestore = document.getElementById('menuRestore');
    if(menuRestore) menuRestore.onclick = ()=>{ if(menuPanel) menuPanel.style.display='none'; triggerRestore(); };
    const menuLogout = document.getElementById('menuLogout');
    if(menuLogout) menuLogout.onclick = async ()=>{
      if(menuPanel) menuPanel.style.display='none';
      await supabase.auth.signOut();
      state.session=null; state.expenses=[]; state.theme='paper'; applyTheme(); state.screen='login'; render();
    };
    document.querySelectorAll('.hk-stat').forEach(el=>{
      el.onclick = ()=>{ const r=el.getAttribute('data-range'); state.filterRange = state.filterRange===r?'all':r; render(); };
    });
    document.querySelectorAll('#hkFilters .hk-chip').forEach(el=>{
      el.onclick = ()=>{ state.filterCat = el.getAttribute('data-cat'); render(); };
    });
    document.querySelectorAll('.hk-row[data-id]').forEach(el=>{
      el.onclick = ()=>{ const id=el.getAttribute('data-id'); const exp=state.expenses.find(e=>e.id===id); if(exp) openModal(exp); };
    });
    const hkSearchInput = document.getElementById('hkSearchInput');
    if(hkSearchInput){
      hkSearchInput.oninput = (e)=>{ state.searchQuery = e.target.value; render(); };
      hkSearchInput.focus();
      hkSearchInput.selectionStart = hkSearchInput.selectionEnd = hkSearchInput.value.length;
    }

    // admin shell
    const adminLogoutBtn = document.getElementById('adminLogoutBtn');
    if(adminLogoutBtn) adminLogoutBtn.onclick = async ()=>{ await supabase.auth.signOut(); state.session=null; state.adminCache={}; state.adminExpanded=null; state.screen='login'; render(); };

    wireEyeToggles(document);
  }

  init();
})();
</script>
